[workspace]
members = ["crates/halo-discovery", "crates/halo-ffi"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1.91"
mdns-sd = "0.20.3"
network-interface = "2.0.5"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4"] }
flutter_rust_bridge = "=2.12.0"
