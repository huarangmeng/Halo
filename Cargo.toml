[workspace]
members = [
    "crates/halo-core",
    "crates/halo-crypto",
    "crates/halo-discovery",
    "crates/halo-ffi",
    "crates/halo-protocol",
    "crates/halo-transport",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1.91"
hkdf = "0.12.4"
getrandom = "0.4.3"
mdns-sd = "0.20.3"
network-interface = "2.0.5"
p256 = { version = "0.14.0", features = ["ecdsa", "getrandom"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
sha2 = "0.10.9"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }
flutter_rust_bridge = "=2.12.0"
